<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>NexMeet — Hesabım</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-body">
<main class="auth-kart">
  <div class="logo">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="12" fill="#6EE7B7"/>
      <path d="M10 14h12v8l6-4v8l-6-4v2H10z" fill="#0a0a0a"/>
    </svg>
    <span>NexMeet</span>
  </div>
  <h1>Hesabım</h1>
  <p class="auth-aciklama">Giriş yapılan hesap: <strong id="hesapAd">…</strong> <span id="hesapEposta"></span></p>

  <section class="hesap-sil" aria-labelledby="silBaslik">
    <h2 id="silBaslik">Hesabı sil</h2>
    <p class="auth-aciklama">Bu işlem <strong>geri alınamaz</strong>. Hesabınız ve tüm açık oturumlarınız kalıcı olarak silinir; bu cihazdaki oturum da kapanır.</p>
    <form id="hesapSilForm" class="auth-form" novalidate>
      <label>Parolanız
        <input name="parola" type="password" autocomplete="current-password" required maxlength="128" />
      </label>
      <label class="hesap-onay">
        <input name="onay" type="checkbox" />
        <span>Hesabımı kalıcı olarak silmek istiyorum</span>
      </label>
      <button type="submit" id="silBtn" class="btn-tehlike auth-btn" disabled>Hesabımı sil</button>
    </form>
  </section>

  <p id="mesaj" class="auth-mesaj" hidden></p>
  <nav class="auth-linkler">
    <a href="/">Toplantı ekranına dön</a>
  </nav>
</main>
<script src="/static/js/hesabim.js"></script>
</body>
</html>
